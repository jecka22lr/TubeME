name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch ECJ and ProGuard
        run: |
          mkdir -p tools
          curl -sSfL -o tools/ecj.jar https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/3.32.0/ecj-3.32.0.jar
          curl -sSfL -o pg.zip https://github.com/Guardsquare/proguard/releases/download/v7.4.2/proguard-7.4.2.zip
          unzip -q pg.zip && cp proguard-7.4.2/lib/proguard.jar tools/
      - run: ./build.sh
      - run: ./test/run.sh
      - name: Server tests (demo mode)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 server/test_server.py
      - uses: actions/upload-artifact@v4
        with:
          name: TubeME
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TubeME.jar
            dist/TubeME.jad
            dist/TubeME-*.zip
            server/tubeme_server.py
          body_path: RELEASE_NOTES.md
